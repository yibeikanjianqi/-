<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style>
/* ===== 全局CSS变量 ===== */
:root {
  --blu-text-color-white: #ffffff;
  --blu-transparent-bg: rgba(0, 0, 0, 0.4);
  --blu-border-color: rgba(255, 255, 255, 0.2);
}
/* ===== 通用折叠容器样式 ===== */
.cealis-foldable-section {
  margin-bottom: 10px;
  border: 1px solid var(--blu-border-color);
  border-radius: 8px;
  background-color: var(--blu-transparent-bg);
  backdrop-filter: blur(5px);
  color: var(--blu-text-color-white);
}
/* ===== 摘要标题样式 ===== */
.cealis-foldable-section > summary {
  padding: 10px 15px;
  cursor: pointer;
  outline: none;
  font-weight: bold;
  list-style: none;
  display: flex;
  align-items: center;
}
.cealis-foldable-section > summary::before {
  content: '\25B6';
  margin-right: 10px;
  transition: transform 0.2s ease-in-out;
}
.cealis-foldable-section[open] > summary::before {
  transform: rotate(90deg);
}
/* ===== 内容区域样式 ===== */
.cealis-foldable-section-content {
  padding: 10px 15px 15px;
  border-top: 1px solid var(--blu-border-color);
  line-height: 1.6;
}
/* ===== 状态栏具体内容的样式 ===== */
.cealis-status-item {
  margin-bottom: 5px;
  word-wrap: break-word;
}
.cealis-status-item strong {
  font-weight: bold;
  margin-right: 5px;
}
/* ===== 无可phone告标题样式 ===== */
.cealis-phone-log-title {
  padding-bottom: 5px;
  font-weight: bold;
}
/* ===== 无可phone告内部应用分割线样式 ===== */
.cealis-app-divider {
  border: none;
  border-top: 1px solid var(--blu-border-color);
  margin: 15px 0;
}
/* ===== 【已修改】实时评论与记忆区内容样式 - 取消加粗 ===== */
.cealis-comment-log-content,
.cealis-memory-log-content {
  font-weight: normal;
  padding-bottom: 5px;
}
.cealis-foldable-section,
.cealis-foldable-section-content,
.cealis-foldable-section > summary,
.cealis-foldable-section > summary::before {
  color: var(--blu-text-color-white) !important;
}
/* ========== 月亮音乐播放器 ========== */
.cealis-halo-wrapper {
  width: 140px;
  height: 140px;
  margin: 0 auto 12px;
  position: relative;
}
.cealis-moon-viewport {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  z-index: 2;
  animation: moonGlowBreath 3.2s ease-in-out infinite;
}
.cealis-moon-ball {
  width: 100%;
  height: 100%;
  animation: moonBallSpin 25s linear infinite;
}
.cealis-zoomed-moon {
  width: 124%;
  height: 124%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  object-fit: cover;
  object-position: center 0px;
  image-rendering: -webkit-optimize-contrast;
  image-rendering: crisp-edges;
}
.cealis-sphere-mask {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: inset 0 0 26px 10px rgba(0,0,0,0.42);
  pointer-events: none;
  z-index: 2;
}
@keyframes moonBallSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes moonGlowBreath {
  0%, 100% {
    box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.22),
                0 0 16px 5px rgba(255, 255, 255, 0.10);
  }
  50% {
    box-shadow: 0 0 13px 4px rgba(255, 255, 255, 0.38),
                0 0 26px 9px rgba(255, 255, 255, 0.18);
  }
}
.cealis-text-container {
  text-align: center;
  margin-bottom: 10px;
}
.cealis-nano-title {
  color: #eee;
  font-size: 13px;
  text-shadow: 0 1px 3px #000;
}
.cealis-control-dock {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.cealis-icon-btn {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.22);
  color: #eee;
  width: 34px;
  height: 34px;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cealis-icon-btn:hover {
  background: rgba(255, 255, 255, 0.25);
}
</style>
</head>
<body>
<div class="cealis-halo-wrapper">
  <div class="cealis-moon-viewport">
    <div class="cealis-moon-ball">
      <img src="https://free.picui.cn/free/2026/02/23/699b479d9378f.jpg" alt="Moon" class="cealis-zoomed-moon" id="cealis-moon-visual">
    </div>
    <div class="cealis-sphere-mask"></div>
  </div>
</div>
<div class="cealis-text-container">
  <div class="cealis-nano-title" id="cealis-track-name">Loading...</div>
</div>
<div class="cealis-control-dock">
  <button class="cealis-icon-btn" id="cealis-act-prev">⏮</button>
  <button class="cealis-icon-btn cealis-play-trigger" id="cealis-act-toggle">▶</button>
  <button class="cealis-icon-btn" id="cealis-act-next">⏭</button>
</div>
<audio id="cealis-audio-engine" src="./ru%20xi.mp3" preload="metadata" loop crossorigin="anonymous">

<script>
(function () {
  const audio = document.getElementById('cealis-audio-engine');
  const toggleBtn = document.getElementById('cealis-act-toggle');
  const trackLabel = document.getElementById('cealis-track-name');
  const moonBall = document.querySelector('.cealis-moon-ball');
  function updatePlayIcon() {
    toggleBtn.textContent = audio.paused ? "▶" : "⏸";
    moonBall.style.animationPlayState = audio.paused ? 'paused' : 'running';
  }
  toggleBtn.addEventListener('click', function () {
    if (audio.paused) {
      audio.play().catch(function (e) {
        trackLabel.innerText = "音频加载失败！";
      });
    } else {
      audio.pause();
    }
    updatePlayIcon();
  });
  audio.addEventListener('loadedmetadata', function () {
    // 这里修改播放器显示的曲目名称！！
    trackLabel.innerText = "裴鸿与｜藏月";
  });
  audio.addEventListener('pause', updatePlayIcon);
  audio.addEventListener('play', updatePlayIcon);
  document.getElementById('cealis-act-prev').addEventListener('click', function () {
    trackLabel.textContent = "尚未实现切歌";
  });
  document.getElementById('cealis-act-next').addEventListener('click', function () {
    trackLabel.textContent = "尚未实现切歌";
  });
  updatePlayIcon();
})();
</script>
</body>
</html>
